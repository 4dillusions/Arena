<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1160" width="980" height="1160" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151b"/>
      <stop offset="100%" stop-color="#171c24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232b37"/>
      <stop offset="100%" stop-color="#1d2430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d241f"/>
      <stop offset="100%" stop-color="#c03b2f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a94d"/>
      <stop offset="100%" stop-color="#f4d88d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a94d"/>
    </marker>
  </defs>

  <rect width="980" height="1160" fill="url(#bg)"/>
  <ellipse cx="490" cy="0" rx="340" ry="90" fill="#c03b2f" opacity="0.08"/>

  <text x="490" y="48" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="8" fill="#f2d48a">ARENA FLOW</text>
  <text x="490" y="70" text-anchor="middle" font-size="13" letter-spacing="2" fill="#8c97a8">Runtime behavior · .NET 10 · current game loop</text>

  <rect x="100" y="110" width="780" height="82" rx="10" fill="url(#panel)" stroke="#3b4657" filter="url(#shadow)"/>
  <rect x="100" y="110" width="780" height="36" rx="10" fill="url(#accent)"/>
  <text x="490" y="134" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f7e8c0">1. Application Start</text>
  <text x="130" y="166" font-size="12" fill="#c4ccd8">Program initializes DI, builds the view stack, parses the optional hero-count argument, then opens the terminal UI.</text>
  <rect x="128" y="174" width="96" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="176" y="187" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">Program.cs</text>
  <rect x="232" y="174" width="98" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="281" y="187" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">DIBindings</text>
  <rect x="338" y="174" width="86" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="381" y="187" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">Terminal</text>

  <line x1="490" y1="192" x2="490" y2="223" stroke="#d4a94d" stroke-width="2.2"/>
  <polygon points="484,223 496,223 490,232" fill="#d4a94d"/>

  <rect x="80" y="232" width="820" height="114" rx="10" fill="url(#panel)" stroke="#3b4657" filter="url(#shadow)"/>
  <rect x="80" y="232" width="820" height="36" rx="10" fill="url(#accent)"/>
  <text x="490" y="256" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f7e8c0">2. Arena Initialization</text>
  <text x="130" y="290" font-size="12" fill="#c4ccd8">Arena validates the requested hero count. If it is smaller than 2 or above the configured maximum, the game writes an error log and exits early.</text>
  <text x="130" y="312" font-size="12" fill="#c4ccd8">If valid, BattleSystem creates a random hero-type list, materializes HeroDTO instances, assigns IDs, and stores them in the arena list.</text>
  <rect x="128" y="320" width="84" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="170" y="333" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">Arena.cs</text>
  <rect x="218" y="320" width="102" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="269" y="333" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">BattleSystem</text>
  <rect x="326" y="320" width="148" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="400" y="333" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">RecruitmentManager&lt;T&gt;</text>

  <line x1="490" y1="346" x2="490" y2="375" stroke="#d4a94d" stroke-width="2.2"/>
  <polygon points="484,375 496,375 490,384" fill="#d4a94d"/>

  <rect x="300" y="384" width="380" height="78" rx="12" fill="#141a22" stroke="#d4a94d" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="490" y="411" text-anchor="middle" font-size="15" font-weight="700" fill="#f4d88d">Hero Count Valid?</text>
  <text x="490" y="435" text-anchor="middle" font-size="12" fill="#c4ccd8">At least 2 and not above GameConfigDTO.MaximumArenaHeroCount</text>

  <line x1="300" y1="423" x2="164" y2="423" stroke="url(#gold)" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="232" y="411" text-anchor="middle" font-size="11" fill="#93a0b3">No</text>

  <rect x="70" y="388" width="190" height="72" rx="10" fill="url(#panel)" stroke="#3b4657" filter="url(#shadow)"/>
  <text x="165" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#f4d88d">Abort With Log</text>
  <text x="165" y="438" text-anchor="middle" font-size="12" fill="#c4ccd8">Write validation error</text>
  <text x="165" y="454" text-anchor="middle" font-size="12" fill="#c4ccd8">Stop GameLoop()</text>

  <line x1="490" y1="462" x2="490" y2="495" stroke="#d4a94d" stroke-width="2.2"/>
  <polygon points="484,495 496,495 490,504" fill="#d4a94d"/>
  <text x="509" y="485" font-size="11" fill="#93a0b3">Yes</text>

  <rect x="100" y="504" width="780" height="108" rx="10" fill="url(#panel)" stroke="#3b4657" filter="url(#shadow)"/>
  <rect x="100" y="504" width="780" height="36" rx="10" fill="url(#accent)"/>
  <text x="490" y="528" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f7e8c0">3. Enter Round Loop</text>
  <text x="130" y="562" font-size="12" fill="#c4ccd8">GameLoop writes “Game started.” and repeatedly executes rounds while more than one hero remains in the arena.</text>
  <text x="130" y="584" font-size="12" fill="#c4ccd8">Each round is logged after execution using the controller's round result and the arena log formatter.</text>
  <rect x="128" y="590" width="132" height="18" rx="4" fill="#12171f" stroke="#465062"/>
  <text x="194" y="603" text-anchor="middle" font-size="10" fill="#efe3c1" font-family="monospace">ArenaRoundResult</text>

  <line x1="490" y1="612" x2="490" y2="643" stroke="#d4a94d" stroke-width="2.2"/>
  <polygon points="484,643 496,643 490,652" fill="#d4a94d"/>

  <rect x="100" y="652" width="780" height="294" rx="10" fill="url(#panel)" stroke="#3b4657" filter="url(#shadow)"/>
  <rect x="100" y="652" width="780" height="36" rx="10" fill="url(#accent)"/>
  <text x="490" y="676" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f7e8c0">4. Run One Battle Round</text>

  <rect x="128" y="708" width="724" height="48" rx="8" fill="#141a22" stroke="#3b4657"/>
  <text x="150" y="728" font-size="12" fill="#f4d88d" font-weight="700">4.1 Select battle heroes</text>
  <text x="150" y="746" font-size="12" fill="#c4ccd8">BattleSystem picks two random heroes, returns them as BattleHeroes, and returns the rest as RemainingHeroes.</text>

  <rect x="128" y="766" width="724" height="48" rx="8" fill="#141a22" stroke="#3b4657"/>
  <text x="150" y="786" font-size="12" fill="#f4d88d" font-weight="700">4.2 Rest non-fighting heroes</text>
  <text x="150" y="804" font-size="12" fill="#c4ccd8">Remaining heroes gain +10 power and are clamped to their configured maximum.</text>

  <rect x="128" y="824" width="724" height="48" rx="8" fill="#141a22" stroke="#3b4657"/>
  <text x="150" y="844" font-size="12" fill="#f4d88d" font-weight="700">4.3 Resolve attacker vs defender</text>
  <text x="150" y="862" font-size="12" fill="#c4ccd8">Battle rules decide who dies or survives, then both fighters lose half their power and are revalidated.</text>

  <rect x="128" y="882" width="724" height="48" rx="8" fill="#141a22" stroke="#3b4657"/>
  <text x="150" y="902" font-size="12" fill="#f4d88d" font-weight="700">4.4 Return survivors to arena</text>
  <text x="150" y="920" font-size="12" fill="#c4ccd8">Arena rebuilds heroList from RemainingHeroes + surviving battle heroes, then logs selected fighters and battle aftermath.</text>

  <line x1="490" y1="946" x2="490" y2="963" stroke="#d4a94d" stroke-width="2.2"/>
  <polygon points="484,963 496,963 490,972" fill="#d4a94d"/>

  <rect x="290" y="972" width="400" height="78" rx="12" fill="#141a22" stroke="#d4a94d" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="490" y="999" text-anchor="middle" font-size="15" font-weight="700" fill="#f4d88d">More Than One Hero Left?</text>
  <text x="490" y="1023" text-anchor="middle" font-size="12" fill="#c4ccd8">If yes, loop to the next turn. Otherwise finish the game.</text>

  <path d="M 290 1010 L 60 1010 L 60 592 L 100 592" fill="none" stroke="url(#gold)" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="74" y="816" text-anchor="middle" font-size="11" fill="#93a0b3">Yes</text>

  <line x1="490" y1="1050" x2="490" y2="1081" stroke="#d4a94d" stroke-width="2.2"/>
  <polygon points="484,1081 496,1081 490,1090" fill="#d4a94d"/>
  <text x="509" y="1073" font-size="11" fill="#93a0b3">No</text>

  <rect x="70" y="1090" width="840" height="74" rx="10" fill="url(#panel)" stroke="#3b4657" filter="url(#shadow)"/>
  <rect x="70" y="1090" width="840" height="36" rx="10" fill="url(#accent)"/>
  <text x="490" y="1114" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f7e8c0">5. End State</text>
  <text x="100" y="1144" font-size="12" fill="#c4ccd8">GameLoop writes “Game over!”. If exactly one hero remains, it logs the winner with the “Laurel wreath” role; otherwise it logs that nobody survived.</text>

</svg>
